[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healtest"
version = "1.0.0"
description = "AI-assisted, self-healing, application-agnostic web test automation driven by Excel"
requires-python = ">=3.10"
dependencies = [
    "selenium>=4.15",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "openai>=1.3",
    "PyYAML>=6.0",
    "webdriver-manager>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
healtest = "healtest.cli:main"

[tool.setuptools.packages.find]
include = ["healtest*"]
