<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture Login Page</title></head>
<body>
  <header role="banner">
    <nav>
      <a href="/home">Home</a>
      <a href="/signup-login" data-testid="signup-login-link">Signup / Login</a>
    </nav>
  </header>
  <main>
    <form id="login-form">
      <h2>Login to your account</h2>
      <label for="login-email">Email Address</label>
      <input id="login-email" name="email" type="email" data-testid="login-email-input" placeholder="Email Address" />
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" data-testid="login-password-input" placeholder="Password" />
      <button id="login-btn" type="submit" data-testid="login-submit-button">Login</button>
    </form>
  </main>
</body>
</html>
