<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture Twin Forms Page</title></head>
<body>
  <!-- Mirrors automationexercise.com's /login page: two sibling sections, each
       with an identically-attributed email input (same name/type/placeholder),
       distinguishable only by their enclosing section's heading. -->
  <div class="row">
    <div class="col login-section">
      <h2>Login to your account</h2>
      <form id="login-form">
        <input type="email" name="email" placeholder="Email Address" />
        <input type="password" name="password" placeholder="Password" />
        <button type="submit">Login</button>
      </form>
    </div>
    <div class="col signup-section">
      <h2>New User Signup!</h2>
      <form id="signup-form">
        <input type="text" name="name" placeholder="Name" />
        <input type="email" name="email" placeholder="Email Address" />
        <button type="submit">Signup</button>
      </form>
    </div>
  </div>
</body>
</html>
