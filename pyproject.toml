[project]
name = "shtaf"
version = "0.1.0"
description = "Self-Healing Test Automation Framework"
requires-python = ">=3.10"
dependencies = [
    "selenium>=4.25.0,<5",
    "openpyxl>=3.1.5,<4",
    "pydantic>=2.9.2,<3",
    "pyyaml>=6.0.2,<7",
    "openai>=1.54.4,<2",
    "python-dotenv>=1.0.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3,<9",
    "pytest-mock>=3.14.0,<4",
    "ruff>=0.7.4,<1",
    "black>=24.10.0,<25",
]
# A local demo dashboard (dashboard/), separate from the framework itself --
# the core engine (framework/) never gains a web-server dependency just to
# support a client-facing UI for watching it run.
dashboard = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
]

[project.scripts]
shtaf = "framework.cli:main"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["framework*"]
